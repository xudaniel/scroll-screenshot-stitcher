[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scroll-screenshot-stitcher"
version = "0.1.0"
description = "High-confidence, pixel-preserving reconstruction of vertically scrolling screenshots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "opencv-python>=4.8",
]

[project.scripts]
scroll-stitch = "stitch_scroll:main"

[tool.setuptools]
py-modules = ["stitch_scroll"]
